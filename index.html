<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoTrader | Athena Bot Command Center</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0e14; color: #e1e7ef; font-family: 'Inter', sans-serif; }
    .glass-panel { background: rgba(18, 24, 38, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2b3548; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0b0e14] text-gray-100 pb-4">

  <!-- Header / Navigation -->
  <header class="h-14 border-b border-gray-800 bg-[#0e131f] flex items-center justify-between px-4 sticky top-0 z-20">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 p-2 rounded-lg text-white">
        <i class="fa-solid fa-chart-line text-base"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm leading-tight">AlgoTrader <span class="text-[10px] font-normal text-blue-400 bg-blue-900/40 px-1.5 py-0.5 rounded">Athena V1.0</span></h1>
        <p class="text-[10px] text-gray-400">Command Center</p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <div class="flex items-center space-x-1.5 bg-gray-800/80 px-2 py-1 rounded-lg border border-gray-700 text-[10px]">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="font-medium text-gray-200">Testnet</span>
      </div>
      <div class="bg-emerald-950/60 border border-emerald-500/30 text-emerald-400 px-2 py-1 rounded-lg text-[10px] font-semibold">
        ACTIVE
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex flex-col p-3 space-y-3 max-w-lg mx-auto w-full">
    
    <!-- Strategy Console & Price Card -->
    <div class="glass-panel p-3 rounded-xl flex flex-col space-y-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <h2 class="font-bold text-lg text-white">BTCUSDT</h2>
          <span class="text-[10px] bg-gray-800 px-1.5 py-0.5 rounded text-gray-300">5m</span>
          <span id="current-price" class="text-sm font-mono font-semibold text-emerald-400">$0.00</span>
        </div>
      </div>

      <!-- Strategy Indicator Tags -->
      <div class="flex items-center space-x-1.5 overflow-x-auto custom-scrollbar py-1 text-[11px]">
        <button class="bg-blue-600 text-white px-2.5 py-1 rounded-md font-medium shrink-0">EMA CROSSOVER</button>
        <button class="bg-gray-800 text-gray-300 px-2.5 py-1 rounded-md shrink-0">RSI 14</button>
        <button class="bg-gray-800 text-gray-300 px-2.5 py-1 rounded-md shrink-0">MACD</button>
      </div>
    </div>

    <!-- Candlestick Chart Panel -->
    <div class="glass-panel rounded-xl p-3 flex flex-col space-y-2">
      <div class="text-[11px] text-gray-400 font-medium">Live Candlestick Stream (BTC/USDT)</div>
      <div id="chart-candlestick" class="w-full h-64 rounded-lg overflow-hidden"></div>
      <div class="h-px bg-gray-800"></div>
      <div class="text-[11px] text-gray-400 font-medium">RSI Oscillator (14)</div>
      <div id="chart-rsi" class="w-full h-24 rounded-lg overflow-hidden"></div>
    </div>

    <!-- Market Pulse -->
    <div class="glass-panel rounded-xl p-3 flex flex-col space-y-2">
      <h3 class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Market Pulse</h3>
      <div class="flex justify-between items-center p-2 rounded bg-gray-900/60 text-xs">
        <div>
          <p class="font-bold text-white">BTCUSDT</p>
          <p class="text-gray-400 text-[10px]">Price: <span class="text-gray-200" id="ticker-btc">$0.00</span></p>
        </div>
        <span class="text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded text-[10px] font-semibold">ONLINE</span>
      </div>
    </div>

    <!-- Execution Terminal Console Logs -->
    <div class="glass-panel rounded-xl p-3 flex flex-col">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Athena Execution Log</h3>
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      </div>
      <div id="terminal-logs" class="bg-[#070a0f] p-2.5 rounded-lg border border-gray-800 font-mono text-[10px] h-32 overflow-y-auto custom-scrollbar space-y-1 text-gray-300">
        <p class="text-gray-500">[SYSTEM] Athena dashboard online...</p>
        <p class="text-blue-400">[CONNECT] WebSocket live stream active for BTCUSDT</p>
      </div>
    </div>

  </div>

  <!-- Real-Time Charting & WebSocket Script -->
  <script>
    const chartElement = document.getElementById('chart-candlestick');
    const rsiElement = document.getElementById('chart-rsi');

    const chart = LightweightCharts.createChart(chartElement, {
      layout: { background: { type: 'solid', color: '#121826' }, textColor: '#9ca3af' },
      grid: { vertLines: { color: 'rgba(255, 255, 255, 0.03)' }, horzLines: { color: 'rgba(255, 255, 255, 0.03)' } },
      timeScale: { timeVisible: true, secondsVisible: false }
    });

    const candlestickSeries = chart.addCandlestickSeries({
      upColor: '#10b981', downColor: '#ef4444', borderVisible: false, wickUpColor: '#10b981', wickDownColor: '#ef4444'
    });

    const rsiChart = LightweightCharts.createChart(rsiElement, {
      layout: { background: { type: 'solid', color: '#121826' }, textColor: '#9ca3af' },
      grid: { vertLines: { color: 'rgba(255, 255, 255, 0.03)' }, horzLines: { color: 'rgba(255, 255, 255, 0.03)' } },
      timeScale: { visible: false }
    });

    const rsiSeries = rsiChart.addLineSeries({ color: '#3b82f6', lineWidth: 2 });

    // Stream live candles from Binance WebSocket
    const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@kline_5m');
    
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.k) {
        const kline = data.k;
        const candle = {
          time: Math.floor(kline.t / 1000),
          open: parseFloat(kline.o),
          high: parseFloat(kline.h),
          low: parseFloat(kline.l),
          close: parseFloat(kline.c)
        };
        candlestickSeries.update(candle);
        document.getElementById('current-price').innerText = `$${candle.close.toFixed(2)}`;
        document.getElementById('ticker-btc').innerText = `$${candle.close.toFixed(2)}`;

        const mockRsi = 45 + Math.random() * 20;
        rsiSeries.update({ time: candle.time, value: mockRsi });
      }
    };

    function logTerminal(message, type = 'info') {
      const logs = document.getElementById('terminal-logs');
      const p = document.createElement('p');
      const timestamp = new Date().toLocaleTimeString();
      p.innerText = `[${timestamp}] ${message}`;
      if (type === 'buy') p.className = 'text-emerald-400 font-semibold';
      else if (type === 'sell') p.className = 'text-red-400 font-semibold';
      else p.className = 'text-gray-300';
      logs.appendChild(p);
      logs.scrollTop = logs.scrollHeight;
    }

    setInterval(() => {
      if (Math.random() > 0.7) {
        logTerminal('Athena monitoring trend: Market conditions stable.', 'info');
      }
    }, 15000);
  </script>
</body>
</html>
